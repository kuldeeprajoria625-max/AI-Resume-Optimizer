<text x="800" y="75" fill="#fff" font-family="Arial" font-size="42" font-weight="700" text-anchor="middle">AI RESUME OPTIMIZER — SYSTEM ARCHITECTURE</text>
<text x="800" y="115" fill="#9ec9ed" font-family="Arial" font-size="22" text-anchor="middle">n8n orchestration • semantic matching • structured LLM feedback</text>
<rect x="100" y="190" width="300" height="125" rx="20" fill="url(#card)" stroke="#35c9ed" stroke-width="3"/><text x="250.0" y="238" fill="#fff" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">1. USER INPUT</text><text x="250.0" y="274" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">Resume PDF + Job Description</text><rect x="470" y="190" width="300" height="125" rx="20" fill="url(#card)" stroke="#35c9ed" stroke-width="3"/><text x="620.0" y="238" fill="#fff" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">2. EXTRACTION</text><text x="620.0" y="274" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">n8n Form Trigger + PDF extraction</text><rect x="840" y="190" width="300" height="125" rx="20" fill="url(#card)" stroke="#35c9ed" stroke-width="3"/><text x="990.0" y="238" fill="#fff" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">3. PREPARATION</text><text x="990.0" y="274" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">Normalize text + sentence chunks</text><rect x="1210" y="190" width="300" height="125" rx="20" fill="url(#card)" stroke="#35c9ed" stroke-width="3"/><text x="1360.0" y="238" fill="#fff" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">4. EMBEDDINGS</text><text x="1360.0" y="274" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">Gemini embedding vectors</text><rect x="310" y="430" width="400" height="155" rx="20" fill="url(#card)" stroke="#35c9ed" stroke-width="3"/><text x="510.0" y="478" fill="#fff" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">5A. SEMANTIC MATCHING</text><text x="510.0" y="514" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">Cosine similarity • best chunk match</text><text x="510.0" y="544" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">Weak requirement identification</text><rect x="890" y="430" width="400" height="155" rx="20" fill="url(#card)" stroke="#35c9ed" stroke-width="3"/><text x="1090.0" y="478" fill="#fff" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">5B. LLM EVALUATION</text><text x="1090.0" y="514" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">Skills • role fit • experience</text><text x="1090.0" y="544" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">Matched/missing skills • suggestions</text><rect x="600" y="710" width="400" height="135" rx="20" fill="url(#card)" stroke="#35c9ed" stroke-width="3"/><text x="800.0" y="758" fill="#fff" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">6. SCORE AGGREGATION</text><text x="800.0" y="794" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">40% Semantic + 30% Skills</text><text x="800.0" y="824" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">20% Role Match + 10% Experience</text><rect x="600" y="900" width="400" height="90" rx="20" fill="url(#card)" stroke="#35c9ed" stroke-width="3"/><text x="800.0" y="948" fill="#fff" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">7. RESULT</text><text x="800.0" y="984" fill="#b9d8f4" font-family="Arial" font-size="18" text-anchor="middle">Score • Verdict • Improvement priorities</text><path d="M400,252 L470,252" fill="none" stroke="#48d9ef" stroke-width="5" marker-end="url(#arrow)"/><path d="M770,252 L840,252" fill="none" stroke="#48d9ef" stroke-width="5" marker-end="url(#arrow)"/><path d="M1140,252 L1210,252" fill="none" stroke="#48d9ef" stroke-width="5" marker-end="url(#arrow)"/><path d="M1360,315 L1090,430" fill="none" stroke="#48d9ef" stroke-width="5" marker-end="url(#arrow)"/><path d="M990,315 L510,430" fill="none" stroke="#48d9ef" stroke-width="5" marker-end="url(#arrow)"/><path d="M710,507 L890,507" fill="none" stroke="#48d9ef" stroke-width="5" marker-end="url(#arrow)"/><p